<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project - CuboidMC</title>
  <link rel="stylesheet" href="https://www.cuboidmc.com/style.css">
  <link rel="icon" type="image/png" href="https://www.cuboidmc.com/images/cuboidimage.png">
  <link rel="apple-touch-icon" href="https://www.cuboidmc.com/images/cuboidimage.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #0d0d0d;
      --card-bg: rgba(24, 24, 24, 0.88);
      --accent-red: #ff2a2a;
      --accent-hover: #e02020;
      --text-white: #ffffff;
      --text-gray: #d0d0d0;
      --font-pixel: 'Courier New', Courier, monospace;
    }

    body {
      color: var(--text-white);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      background-color: #0d0d0d;
    }

    /* Background Container */
    .bg-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      /* Fixed to .png here! */
      background-image: linear-gradient(rgba(13, 13, 13, 0.7), rgba(13, 13, 13, 0.85)), url('https://www.cuboidmc.com/images/cuboidimage.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 8%;
      background-color: rgba(13, 13, 13, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--accent-red);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      text-decoration: none;
      max-height: 45px; /* Keeps the whole logo area small */
    }

    /* THIS FIXES THE HUGE IMAGE ISSUE */
    .brand-logo img {
      width: 40px !important;
      height: 40px !important;
      max-width: 40px !important;
      max-height: 40px !important;
      object-fit: contain;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .logo-text {
      font-family: var(--font-pixel);
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent-red);
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 2rem;
    }

    nav a {
      color: var(--text-white);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: var(--accent-red);
    }

    .content-container {
      max-width: 900px;
      margin: 4rem auto;
      padding: 0 2rem;
    }

    .tag {
      display: inline-block;
      background-color: rgba(255, 42, 42, 0.3);
      color: var(--accent-red);
      padding: 0.3rem 0.8rem;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 1rem;
      border: 1px solid var(--accent-red);
    }

    h1 {
      font-family: var(--font-pixel);
      font-size: 2.8rem;
      color: var(--accent-red);
      margin-bottom: 1.5rem;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
    }

    .project-details {
      background-color: var(--card-bg);
      padding: 2.5rem;
      border-radius: 8px;
      border: 1px solid #333333;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
    }

    .project-details h2 {
      font-family: var(--font-pixel);
      color: var(--text-white);
      margin: 1.5rem 0 0.8rem 0;
    }

    .project-details p {
      color: var(--text-gray);
      margin-bottom: 1rem;
    }

  </style>
</head>
<body>

  <div class="bg-wrapper"></div>

  <header>
    <a href="https://www.cuboidmc.com" class="brand-logo">
      <img src="https://www.cuboidmc.com/images/cuboidimage.png" alt="CuboidMC Logo">
      <span class="logo-text">CuboidMC</span>
    <nav>
      <ul>
        <li><a href="https://www.cuboidmc.com">Home</a></li>
        <li><a href="https://www.cuboidmc.com/projects">Projects</a></li>
        <li><a href="https://www.cuboidmc.com/blog">Blog</a></li>
        <li><a href="https://www.cuboidmc.com#team">Team</a></li>
        <li><a href="https://www.cuboidmc.com#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="content-container">
    <a href="https://www.cuboidmc.com/projects" style="color: #ffffff; text-decoration: none; font-weight: 600; text-shadow: 1px 1px 2px #000;">&larr; Back to Projects</a>
    <br><br>
    
    <span class="tag">Template</span>
    <h1>Project Name</h1>

    <div class="project-details">
      <h2>Header</h2>
      <p><strong>Text heret</strong></p>

      
    <a href="https://www.cuboidmc.com/projects" class="btn">Explore Other Projects</a>
  </main>

  <footer>
    <p>&copy; 2026 CuboidMC. All rights reserved. Not affiliated with Mojang Studios.</p>
  </footer>

</body>
</html>
