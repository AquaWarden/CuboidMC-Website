<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | CuboidMC</title>
  <link rel="stylesheet" href="https://www.cuboidmc.com/style.css">
  <script>
  // Get the path portion (e.g., "/profiles/" or "/testing404redirect")
  let path = window.location.pathname;

  // Remove trailing slashes so "/profiles/" becomes "/profiles"
  if (path.length > 1 && path.endsWith('/')) {
    path = path.slice(0, -1);
  }

  // Check the path matches
  if (path === '/profiles' || path === '/testing404redirect') {
    // Redirect relative to root domain
    window.location.replace('https://www.cuboidmc.com/errors/profiles');
  }
</script>
  
</head>
<body>

  <!-- Navigation -->
  <header>
    <a href="https://www.cuboidmc.com/" class="brand-logo">
      <img src="https://www.cuboidmc.com/images/cuboidimage.png" alt="CuboidMC Logo">
      <span class="logo-text">CuboidMC</span>
    </a>
    <nav>
      <ul>
        <li><a href="https://www.cuboidmc.com/">Home</a></li>
        <li><a href="https://www.cuboidmc.com/projects">Projects</a></li>
        <li><a href="https://www.cuboidmc.com/blog">Blog</a></li>
        <li><a href="https://www.cuboidmc.com/#team">Team</a></li>
        <li><a href="https://www.cuboidmc.com/#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main 404 Section -->
  <main class="error-container">
    <div class="error-code">404</div>
    <h1 class="error-title">Thats an <span>Error!</span></h1>
    <p class="error-desc">
      The page you entered does not exist.
    </p>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 CuboidMC. All rights reserved. Not affiliated with Mojang Studios.</p>
  </footer>

</body>
</html>
