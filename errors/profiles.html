<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error | CuboidMC</title>
  <style>
    /* Reset & CSS Variables */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #0d0d0d;
      --card-bg: #181818;
      --accent-red: #ff2a2a;
      --accent-hover: #e02020;
      --text-white: #ffffff;
      --text-gray: #a0a0a0;
      --font-pixel: 'Courier New', Courier, monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 8%;
      background-color: rgba(13, 13, 13, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--accent-red);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      text-decoration: none;
    }

    .brand-logo img {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      object-fit: contain;
    }

    .logo-text {
      font-family: var(--font-pixel);
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent-red);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 2rem;
      align-items: center;
    }

    nav a {
      color: var(--text-white);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    nav a:hover {
      color: var(--accent-red);
    }

    /* 404 Hero Container */
    .error-container {
      text-align: center;
      padding: 4rem 2rem;
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }

    .error-code {
      font-family: var(--font-pixel);
      font-size: 7rem;
      font-weight: bold;
      color: var(--accent-red);
      line-height: 1;
      margin-bottom: 1rem;
      text-shadow: 0 0 20px rgba(255, 42, 42, 0.4);
    }

    .error-title {
      font-family: var(--font-pixel);
      font-size: 2.2rem;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .error-title span {
      color: var(--accent-red);
    }

    .error-desc {
      color: var(--text-gray);
      font-size: 1.15rem;
      margin-bottom: 2.5rem;
      max-width: 500px;
    }



    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid #282828;
      color: var(--text-gray);
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 1rem;
      }
      .error-code {
        font-size: 5rem;
      }
      .error-title {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <a href="https://www.cuboidmc.com/" class="brand-logo">
      <img src="https://www.cuboidmc.com/images/cuboidimage.png" alt="CuboidMC Logo">
      <span class="logo-text">CuboidMC</span>
    </a>
    <nav>
      <ul>
        <li><a href="https://www.cuboidmc.com/">Home</a></li>
        <li><a href="https://www.cuboidmc.com/projects">Projects</a></li>
        <li><a href="https://www.cuboidmc.com/blog">Blog</a></li>
        <li><a href="https://www.cuboidmc.com/#team">Team</a></li>
        <li><a href="https://www.cuboidmc.com/#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main 404 Section -->
  <main class="error-container">
    <div class="error-code">Error</div>
    <h1 class="error-title">Syntax is <span>invalid!</span></h1>
    <p class="error-desc">
      Path not complete! Correct path: https://www.cuboidmc.com/profiles/'profile'
    </p>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 CuboidMC. All rights reserved. Not affiliated with Mojang Studios.</p>
  </footer>

</body>
</html>
