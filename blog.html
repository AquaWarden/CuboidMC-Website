<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Blog | CuboidMC</title>
  <style>
    /* Reset & CSS Variables */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #0d0d0d;
      --card-bg: #181818;
      --accent-red: #ff2a2a;
      --accent-hover: #e02020;
      --text-white: #ffffff;
      --text-gray: #a0a0a0;
      --font-pixel: 'Courier New', Courier, monospace;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      line-height: 1.6;
    }

    /* Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 8%;
      background-color: rgba(13, 13, 13, 0.95);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--accent-red);
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      text-decoration: none;
    }

    .brand-logo img {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      object-fit: contain;
    }

    .logo-text {
      font-family: var(--font-pixel);
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent-red);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 2rem;
      align-items: center;
    }

    nav a {
      color: var(--text-white);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    nav a:hover, nav a.active {
      color: var(--accent-red);
    }

    /* Layout */
    .blog-container {
      max-width: 900px;
      margin: 3rem auto;
      padding: 0 2rem;
    }

    .page-title {
      font-family: var(--font-pixel);
      font-size: 2.8rem;
      color: var(--text-white);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .page-title span {
      color: var(--accent-red);
    }

    .subtitle {
      color: var(--text-gray);
      margin-bottom: 3rem;
    }

    /* Blog Post Card */
    .blog-post {
      background-color: var(--card-bg);
      border-radius: 8px;
      border: 1px solid #282828;
      padding: 2.5rem;
      margin-bottom: 2.5rem;
      transition: border-color 0.3s ease;
    }

    .blog-post:hover {
      border-color: var(--accent-red);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .author-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .author-avatar {
      width: 35px;
      height: 35px;
      border-radius: 4px;
      border: 1px solid var(--accent-red);
      image-rendering: pixelated;
    }

    .author-name {
      font-weight: bold;
      color: var(--text-white);
      font-size: 0.95rem;
    }

    .post-date {
      font-size: 0.85rem;
      color: var(--text-gray);
      font-family: var(--font-pixel);
    }

    .post-title {
      font-size: 1.8rem;
      color: var(--accent-red);
      margin-bottom: 1rem;
      font-family: var(--font-pixel);
    }

    .post-body {
      color: var(--text-gray);
      margin-bottom: 1.5rem;
      line-height: 1.7;
    }

    .post-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tag {
      background-color: rgba(255, 42, 42, 0.15);
      color: var(--accent-red);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      font-family: var(--font-pixel);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid #282828;
      color: var(--text-gray);
      font-size: 0.9rem;
      margin-top: 4rem;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <a href="index.html" class="brand-logo">
      <img src="cuboidimage.png" alt="CuboidMC Logo">
      <span class="logo-text">CuboidMC</span>
    </a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="blog.html" class="active">Blog</a></li>
        <li><a href="index.html#team">Team</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="blog-container">
    <h1 class="page-title">Developer <span>Blog</span></h1>
    <p class="subtitle">Behind-the-scenes insights, development logs, and design breakdowns from the team.</p>

    <!-- Blog Post Article -->
    <article class="blog-post">
      <div class="post-header">
        <div class="author-info">
          <img src="AquaWarden.png" alt="AquaWarden" class="author-avatar">
          <span class="author-name">AquaWarden</span>
        </div>
        <span class="post-date">July 25, 2026</span>
      </div>
      <h2 class="post-title">TEST</h2>
      <div class="post-body">
        <p>TEST</p>
      </div>
      <div class="post-tags">
        <span class="tag">DevLog</span>
        <span class="tag">Level Design</span>
        <span class="tag">TEST</span>
      </div>
    </article>

  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 CuboidMC. All rights reserved. Not affiliated with Mojang Studios.</p>
  </footer>

</body>
</html>
